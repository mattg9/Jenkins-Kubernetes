apiVersion: v1
kind: Pod
spec:
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:4.11-1  # Base image
    command:
      - "sh"
      - "-c"
      - |
          echo "Running as root to install Python 3.11"
          apt-get install -y build-essential zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev curl
          curl -O https://www.python.org/ftp/python/3.11.0/Python-3.11.0.tgz
          tar -xf Python-3.11.0.tgz
          cd Python-3.11.0
          ./configure --enable-optimizations
          make -j 8
          make install
          python3 --version
    securityContext:
      runAsUser: 0  # Run as root user for installation
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "250m"
    args:
      - "${computer.jnlpmac}"
      - "${computer.name}"