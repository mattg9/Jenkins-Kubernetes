apiVersion: v1
kind: Pod
spec:
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:4.11-1  # Base image
    command:
      - "sh"
      - "-c"
      - |
          # Add Bullseye backports and install Python 3.11
          echo "deb http://deb.debian.org/debian bullseye-backports main" > /etc/apt/sources.list.d/bullseye-backports.list
          apt-get update && apt-get install -y python3.11
          # Optionally create a symbolic link to python3
          ln -s /usr/bin/python3.11 /usr/bin/python3
          exec /usr/bin/java -jar /usr/share/jenkins/jenkins.war  # Start Jenkins agent
    securityContext:
      runAsUser: 0  # Run as root user for installation
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "250m"
    args:
      - "${computer.jnlpmac}"
      - "${computer.name}"