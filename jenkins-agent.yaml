spec:
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:latest
      command:
      - "sh"
      - "-c"
      - |
        echo "Installing Python..." &&
        apt-get update &&
        apt-get install -y python3 python3-pip &&
        python3 --version
      securityContext:
        runAsUser: 0  # Run as root
