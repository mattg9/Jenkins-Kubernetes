apiVersion: v1
kind: Pod
spec:
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:4.11-1  # Base image
    command:
      - "sh"
      - "-c"
      - |
          echo "Running as root to install Python 3.11"
          apt-get update && apt-get install -y --no-install-recommends \
          software-properties-common \
          add-apt-repository ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.11
          apt-get clean
    securityContext:
      runAsUser: 0  # Run as root user for installation
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "250m"
    args:
      - "${computer.jnlpmac}"
      - "${computer.name}"