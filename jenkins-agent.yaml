apiVersion: v1
kind: Pod
spec:
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:4.11-1  # Base image
    command:
      - "sh"
      - "-c"
      - |
          apt-get update && apt-get install -y python3.11
    securityContext:
      runAsUser: 0  # Run as root user for installing Python
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "250m"
    args:
      - "${computer.jnlpmac}"
      - "${computer.name}"
