apiVersion: v1
kind: Pod
spec:
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:latest
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: "1Gi"
      command:
      - "sh"
      - "-c"
      - |
        # Installing Python
        apt-get update &&
        apt-get install -y python3 python3-pip &&
        python3 --version &&
        # Jenkins agent command
        exec java -jar /usr/share/jenkins/agent.jar \
          -url "${JENKINS_URL}" \
          -name "${JENKINS_AGENT_NAME}" \
          -secret "${JENKINS_SECRET}" \
          -workDir "/home/jenkins/agent" \
          ${REMOTING_OPTS}
      securityContext:
        runAsUser: 0
