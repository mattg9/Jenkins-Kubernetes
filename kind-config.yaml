kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jenkins-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000  # The Jenkins container port
        hostPort: 8080      # The port exposed on the host machine
        protocol: TCP

# kind create cluster --config=kind-config.yaml
# kubectl create namespace jenkins
# kubectl apply -f service-account.yaml
# kubectl create -f volume.yaml
# kubectl apply -f jenkins-deployment.yaml
# kubectl get nodes -n jenkins - control pane ready
# kubectl apply -f jenkins-service.yaml
# kubectl get pods -n jenkins - pod is running

# kubectl port-forward svc/jenkins-service 8080:8080 -n jenkins
